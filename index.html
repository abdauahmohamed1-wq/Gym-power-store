<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymPower - أقوى مكملات في مصر</title>
    
    <!-- استدعاء مكتبات React و Tailwind CSS (مجاناً) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .animate-fade-in-up { animation: fadeInUp 0.8s ease-out; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- أيقونات SVG (بدون مكتبات خارجية لتسهيل الرفع) ---
        const Icon = ({ path, className, size = 24 }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {path}
            </svg>
        );

        const Icons = {
            Dumbbell: (props) => <Icon {...props} path={<><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7.9-7.9a2.1 2.1 0 1 1 3 3L6 12.9a2.1 2.1 0 1 1-3-3Z"/><path d="m11.1 13 7.9 7.9a2.1 2.1 0 1 1 3-3L14.1 10a2.1 2.1 0 1 1-3 3Z"/></>} />,
            ShoppingCart: (props) => <Icon {...props} path={<><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></>} />,
            Menu: (props) => <Icon {...props} path={<><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></>} />,
            X: (props) => <Icon {...props} path={<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>} />,
            Trash2: (props) => <Icon {...props} path={<><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>} />,
            Plus: (props) => <Icon {...props} path={<><path d="M5 12h14"/><path d="M12 5v14"/></>} />,
            Minus: (props) => <Icon {...props} path={<><path d="M5 12h14"/></>} />,
            Send: (props) => <Icon {...props} path={<><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>} />,
            Star: (props) => <Icon {...props} path={<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>} />,
            CheckCircle: (props) => <Icon {...props} path={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />
        };

        // --- بيانات المنتجات ---
        const PRODUCTS = [
            { id: 1, name: "واي بروتين جولد ستاندرد", price: 2800, category: "بروتين", image: "https://images.unsplash.com/photo-1593095948071-474c5cc2989d?auto=format&fit=crop&w=400&q=80", description: "الأكثر مبيعاً، 24 جرام بروتين، يعزز الاستشفاء العضلي." },
            { id: 2, name: "كرياتين مونوهايدرات", price: 1200, category: "كرياتين", image: "https://images.unsplash.com/photo-1579722821273-0f6c7d44362f?auto=format&fit=crop&w=400&q=80", description: "يزيد القوة والتحمل، 5000 مجم كرياتين صافي." },
            { id: 3, name: "محفز طاقة C4", price: 1500, category: "طاقة", image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=400&q=80", description: "طاقة متفجرة قبل التمرين، تركيز عالي وأداء قوي." },
            { id: 4, name: "أمينو X - BCAA", price: 1100, category: "استشفاء", image: "https://images.unsplash.com/photo-1623874106686-5be2b325c8f1?auto=format&fit=crop&w=400&q=80", description: "أحماض أمينية للاستشفاء ومنع الهدم العضلي." },
            { id: 5, name: "فيتامين متعدد (Multivitamin)", price: 650, category: "صحة عامة", image: "https://images.unsplash.com/photo-1550572017-edb2b412e61c?auto=format&fit=crop&w=400&q=80", description: "يدعم المناعة والصحة العامة للرياضيين." },
            { id: 6, name: "ماس جينر (زيادة الوزن)", price: 2200, category: "زيادة وزن", image: "https://images.unsplash.com/photo-1579722820308-d74e571900a9?auto=format&fit=crop&w=400&q=80", description: "سعرات حرارية عالية لزيادة الكتلة العضلية والوزن." }
        ];

        function App() {
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [notification, setNotification] = useState(null);

            // رقم هاتفك (استبدله برقمك الحقيقي لاحقاً)
            const phoneNumber = "201000000000"; 

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    return existing 
                        ? prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item)
                        : [...prev, { ...product, quantity: 1 }];
                });
                showNotification(`تمت إضافة ${product.name}`);
            };

            const removeFromCart = (id) => setCart(prev => prev.filter(item => item.id !== id));
            
            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = Math.max(0, item.quantity + delta);
                        return newQty === 0 ? null : { ...item, quantity: newQty };
                    }
                    return item;
                }).filter(Boolean));
            };

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const handleCheckout = () => {
                if (cart.length === 0) return;
                let message = "مرحباً، أريد طلب المنتجات التالية:%0a%0a";
                cart.forEach(item => {
                    message += `- ${item.name} (عدد: ${item.quantity}) - ${item.price * item.quantity} ج.م%0a`;
                });
                message += `%0aالإجمالي: *${cart.reduce((t, i) => t + i.price * i.quantity, 0)} ج.م*`;
                message += "%0a%0aيرجى تأكيد الطلب والعنوان.";
                window.open(`https://wa.me/${phoneNumber}?text=${message}`, '_blank');
            };

            const cartTotal = cart.reduce((t, i) => t + i.price * i.quantity, 0);
            const cartCount = cart.reduce((t, i) => t + i.quantity, 0);

            return (
                <div className="min-h-screen">
                    {/* Navbar */}
                    <nav className="bg-black text-white sticky top-0 z-50 border-b-4 border-red-600 shadow-xl">
                        <div className="container mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center space-x-2 space-x-reverse cursor-pointer" onClick={() => window.scrollTo(0,0)}>
                                <Icons.Dumbbell className="text-red-600" size={32} />
                                <span className="text-2xl font-extrabold tracking-tighter">GYM<span className="text-red-600">POWER</span></span>
                            </div>
                            <div className="hidden md:flex space-x-8 space-x-reverse font-bold text-gray-300">
                                <a href="#" className="hover:text-white transition">الرئيسية</a>
                                <a href="#products" className="hover:text-white transition">المنتجات</a>
                            </div>
                            <div className="flex items-center space-x-4 space-x-reverse">
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2 hover:bg-gray-800 rounded-full transition">
                                    <Icons.ShoppingCart className="text-white" />
                                    {cartCount > 0 && <span className="absolute -top-1 -right-1 bg-red-600 text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">{cartCount}</span>}
                                </button>
                                <button className="md:hidden" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                                    {isMobileMenuOpen ? <Icons.X /> : <Icons.Menu />}
                                </button>
                            </div>
                        </div>
                        {isMobileMenuOpen && (
                            <div className="md:hidden bg-gray-900 p-4 border-t border-gray-800">
                                <a href="#" className="block py-2 hover:text-red-500">الرئيسية</a>
                                <a href="#products" className="block py-2 hover:text-red-500">المنتجات</a>
                            </div>
                        )}
                    </nav>

                    {/* Hero */}
                    <header className="relative bg-gray-900 text-white py-24 text-center overflow-hidden">
                        <div className="absolute inset-0 opacity-20 bg-[url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80')] bg-cover bg-center"></div>
                        <div className="relative z-10 px-4">
                            <h1 className="text-5xl md:text-7xl font-extrabold mb-6 animate-fade-in-up">فورمة <span className="text-red-600">الساحل</span> تبدأ هنا</h1>
                            <p className="text-xl md:text-2xl text-gray-400 mb-8 max-w-2xl mx-auto">أقوى المكملات الأصلية بأسعار زمان. اطلب دلوقتي والدفع عند الاستلام.</p>
                            <a href="#products" className="bg-red-600 hover:bg-red-700 text-white px-10 py-4 rounded-full text-xl font-bold transition transform hover:scale-105 inline-block shadow-lg shadow-red-600/30">اشتري فورمتك</a>
                        </div>
                    </header>

                    {/* Products */}
                    <section id="products" className="py-20 container mx-auto px-4">
                        <h2 className="text-4xl font-extrabold text-center mb-16 text-gray-900">عروض <span className="text-red-600">نااار</span> 🔥</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
                            {PRODUCTS.map(product => (
                                <div key={product.id} className="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition duration-300 border border-gray-100 group">
                                    <div className="relative h-64 overflow-hidden bg-gray-100">
                                        <img src={product.image} alt={product.name} className="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
                                        <span className="absolute top-4 right-4 bg-black/80 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">{product.category}</span>
                                    </div>
                                    <div className="p-6">
                                        <h3 className="text-xl font-bold text-gray-900 mb-2">{product.name}</h3>
                                        <p className="text-gray-500 text-sm mb-4 line-clamp-2">{product.description}</p>
                                        <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-100">
                                            <span className="text-2xl font-black text-red-600">{product.price} ج.م</span>
                                            <button onClick={() => addToCart(product)} className="bg-black text-white px-5 py-2.5 rounded-xl hover:bg-red-600 transition flex items-center gap-2 font-bold shadow-md">
                                                <Icons.ShoppingCart size={18} /> إضافة
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Features */}
                    <section className="bg-white py-16 border-t border-gray-200">
                        <div className="container mx-auto px-4 grid md:grid-cols-3 gap-8 text-center">
                            {[
                                { icon: Icons.CheckCircle, title: "ضمان 100%", text: "منتجات أصلية بالباركود" },
                                { icon: Icons.Star, title: "تقييم عالي", text: "ثقة أكثر من 5000 عميل" },
                                { icon: Icons.Send, title: "توصيل سريع", text: "لحد باب البيت في 48 ساعة" }
                            ].map((f, i) => (
                                <div key={i} className="p-6 rounded-2xl bg-gray-50 hover:bg-gray-100 transition">
                                    <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <f.icon size={32} />
                                    </div>
                                    <h3 className="text-xl font-bold mb-2">{f.title}</h3>
                                    <p className="text-gray-600">{f.text}</p>
                                </div>
                            ))}
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-black text-white py-10 text-center border-t-8 border-red-600">
                        <div className="flex justify-center items-center gap-2 mb-4">
                            <Icons.Dumbbell className="text-red-600" />
                            <span className="text-2xl font-bold">GYM<span className="text-red-600">POWER</span></span>
                        </div>
                        <p className="text-gray-500">© 2024 جميع الحقوق محفوظة</p>
                    </footer>

                    {/* Cart Sidebar */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-[100] flex justify-end">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsCartOpen(false)}></div>
                            <div className="relative w-full max-w-md bg-white h-full shadow-2xl flex flex-col animate-fade-in-up">
                                <div className="p-5 bg-gray-50 border-b flex justify-between items-center">
                                    <h2 className="text-xl font-bold flex items-center gap-2"><Icons.ShoppingCart className="text-red-600" /> عربة التسوق</h2>
                                    <button onClick={() => setIsCartOpen(false)} className="text-gray-400 hover:text-red-600"><Icons.X /></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-5 space-y-4">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-20 text-gray-400">
                                            <Icons.ShoppingCart size={64} className="mx-auto mb-4 opacity-20" />
                                            <p>العربة فاضية يا وحش!</p>
                                        </div>
                                    ) : cart.map(item => (
                                        <div key={item.id} className="flex gap-4 p-3 bg-gray-50 rounded-xl border border-gray-100">
                                            <img src={item.image} className="w-20 h-20 object-cover rounded-lg" />
                                            <div className="flex-1">
                                                <h4 className="font-bold text-gray-900">{item.name}</h4>
                                                <div className="text-red-600 font-bold mt-1">{item.price} ج.م</div>
                                                <div className="flex items-center gap-3 mt-2">
                                                    <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center hover:bg-gray-300"><Icons.Minus size={14} /></button>
                                                    <span className="font-bold">{item.quantity}</span>
                                                    <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center hover:bg-gray-300"><Icons.Plus size={14} /></button>
                                                </div>
                                            </div>
                                            <button onClick={() => removeFromCart(item.id)} className="text-gray-300 hover:text-red-600 h-fit"><Icons.Trash2 size={20} /></button>
                                        </div>
                                    ))}
                                </div>
                                {cart.length > 0 && (
                                    <div className="p-5 border-t bg-gray-50">
                                        <div className="flex justify-between text-xl font-bold mb-4">
                                            <span>الإجمالي:</span>
                                            <span className="text-red-600">{cartTotal} ج.م</span>
                                        </div>
                                        <button onClick={handleCheckout} className="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 shadow-lg shadow-green-600/20 transition">
                                            إتمام الطلب (واتساب) <Icons.Send size={20} />
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {notification && (
                        <div className="fixed bottom-5 right-5 bg-gray-900 text-white px-6 py-4 rounded-xl shadow-2xl z-[200] flex items-center gap-3 animate-fade-in-up">
                            <Icons.CheckCircle className="text-green-500" />
                            <span className="font-bold">{notification}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
